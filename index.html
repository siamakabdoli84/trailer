<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر تریلی‌ها">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#11607F">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>دفتر تریلی‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: mobile ledger. Sticky filter header, five-tab bottom bar, bottom-sheet forms. Truck identity = colour dot + plate box. */
:root{
  --bg:#ECEFF2;--surface:#FFFFFF;--soft:#F2F4F6;--ink:#16202A;--muted:#5A6773;--line:#D8DEE4;
  --accent:#11607F;--on-accent:#FFFFFF;--good:#1B7A4B;--bad:#B23B2B;--due:#9A5B00;
  --c1:#1F6FB5;--c2:#C27A10;--c3:#2E8B6A;--c4:#8A4FB0;--c5:#B5405A;--c6:#5B6770;
  --shadow:0 2px 4px rgba(16,24,32,.08),0 10px 28px rgba(16,24,32,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161C;--surface:#182029;--soft:#1F2934;--ink:#E8EDF1;--muted:#98A5B1;--line:#2A3642;
  --accent:#58B7DB;--on-accent:#06202B;--good:#5CC58F;--bad:#F18B79;--due:#E8B25A;
  --c1:#5DA9E8;--c2:#E6A24B;--c3:#55C09C;--c4:#B88AE0;--c5:#E7819A;--c6:#9BA8B3;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C;--surface:#182029;--soft:#1F2934;--ink:#E8EDF1;--muted:#98A5B1;--line:#2A3642;
  --accent:#58B7DB;--on-accent:#06202B;--good:#5CC58F;--bad:#F18B79;--due:#E8B25A;
  --c1:#5DA9E8;--c2:#E6A24B;--c3:#55C09C;--c4:#B88AE0;--c5:#E7819A;--c6:#9BA8B3;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,-apple-system,Tahoma,sans-serif;font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
#app{direction:rtl;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}
h1,h2,h3,p{margin:0}
small{font-size:.78em;color:var(--muted);font-weight:500}
.good{color:var(--good)}.bad{color:var(--bad)}.duec{color:var(--due)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.top1{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.top1:last-child{margin-bottom:0}
.top h1{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.logo{width:36px;height:36px;object-fit:contain;flex:none}
.vimg{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.dg .lb{grid-column:1/-1;margin-bottom:0}
.dg label span{display:block;font-size:13px;color:var(--muted)}
.dg input{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.per{width:auto;max-width:55%;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--surface)}

main{padding-block:14px 150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;margin-bottom:8px}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.note p{flex:1 1 200px;min-width:0}
.empty{text-align:center;color:var(--muted);padding:36px 8px}

.ln{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.ln span{color:var(--muted)}
.ln b{font-weight:700}
.ln.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.ln.tot span{color:var(--ink);font-weight:700}
.ln.tot b{font-size:26px;font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.split>div{background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0}
.split span{display:block;font-size:12.5px;color:var(--muted)}
.split b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.split em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.cap{font-size:12.5px;color:var(--muted);margin-top:4px}
.num{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dashed var(--muted);padding:0;margin:0;cursor:pointer;text-align:inherit}

.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:7px 8px;white-space:nowrap;text-align:end;border-bottom:1px solid var(--line)}
thead th{color:var(--muted);font-weight:500;font-size:12px}
th[scope=row],thead th:first-child{text-align:start;font-weight:700;position:sticky;inset-inline-start:0;background:var(--surface)}
th[scope=row] .dot{margin-inline-end:6px}
tr.tt th,tr.tt td{font-weight:800;border-bottom:0}
td.bad{color:var(--bad)}td.due{color:var(--due);font-weight:700}

.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0}
.bar .v{font-weight:700;font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/-1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.co{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.co:last-child{border-bottom:0}
.co>div{min-width:0}.co b{display:block}

.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sum>span{color:var(--muted)}.sum>b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sum .pay{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sum .pay b{color:var(--ink)}
.cats{margin-bottom:12px}
.grp{margin-bottom:14px}
.grp h3{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;padding:4px 2px 6px;font-variant-numeric:tabular-nums}
.item{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.item .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .l1 b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .l2{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:0 9px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
@supports (background:color-mix(in srgb,red,blue)){.chip{background:color-mix(in srgb,var(--c) 14%,transparent)}}
.tag{font-size:12px;background:var(--soft);padding:0 8px;border-radius:6px;color:var(--ink)}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted)}
.nav button[aria-current=page]{color:var(--accent);font-weight:700}
.fabw{position:fixed;inset-inline:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;pointer-events:none}
.fabw .wrap{display:flex;justify-content:flex-end}
.fab{pointer-events:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:12px 22px;font-weight:700;box-shadow:var(--shadow)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:12px}
.f{margin-bottom:12px;min-width:0}
.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea,.dt input,.dt select,.fr input,.vname{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.dt{display:grid;grid-template-columns:64px 1fr 84px;gap:8px}
.dt.m{grid-template-columns:1fr 90px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:1.6em}
.err{color:var(--bad);font-size:13px;min-height:1.4em;margin-bottom:4px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg2 button{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-weight:500}
.seg2 button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks button{padding:1px 12px;border-radius:99px;border:1px solid var(--line);background:var(--soft);font-size:13px}
.picks button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wide{width:100%;margin-bottom:12px;border-style:dashed}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.acts .primary{flex:1 1 120px}

.vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vname{flex:1 1 140px;font-weight:800;font-size:17px}
.plate{display:inline-flex;align-items:stretch;direction:ltr;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;color:#111;font-weight:800;font-size:15px;white-space:nowrap}
.plate i{background:#1E4FA8;color:#fff;font-size:9px;font-style:normal;padding:2px 5px;display:flex;align-items:flex-end;direction:rtl}
.plate span{padding:2px 10px;direction:rtl}
.sw{display:flex;gap:10px;margin-bottom:12px}
.swb{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--surface);outline:2px solid transparent;padding:0}
.swb[aria-pressed=true]{outline-color:var(--ink)}
.fr{display:grid;grid-template-columns:112px 1fr 34px;gap:6px;margin-bottom:6px}
.fr input{font-size:15px;padding:7px 10px}
.fr .fk{background:var(--soft);font-weight:500}
.x{border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--muted);font-size:18px;line-height:1}
.vb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--muted);font-size:13px;margin-bottom:10px}
#fallback{width:100%;font-size:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px;direction:ltr}
#rest{font-size:14px;direction:ltr}
#toast{position:fixed;inset-inline:0;bottom:calc(128px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast span{background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:99px;font-size:13px}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="fa"></div>

<script>
(function(){
'use strict';
//<jal>
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],
      bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
  if(jy<jp||jy>=breaks[bl-1])throw new Error('Invalid Jalaali year '+jy);
  for(i=1;i<bl;i+=1){
    jm=breaks[i];jump=jm-jp;
    if(jy<jm)break;
    leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(withoutLeap)return{gy:gy,march:march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j,i,gd,gm,gy;
  j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  i=div(mod(j,1461),4)*5+308;
  gd=div(mod(i,153),5)+1;
  gm=mod(div(i,153),12)+1;
  gy=div(j,1461)-100100+div(8-gm,6);
  return{gy:gy,gm:gm,gd:gd};
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd};}
    else{k-=186;}
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return{jy:jy,jm:jm,jd:jd};
}
function toJ(gy,gm,gd){return d2j(g2d(gy,gm,gd))}
function dim(y,m){return m<=6?31:m<=11?30:(jalCal(y,false).leap===0?30:29)}
//</jal>

var $=function(s,r){return(r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var FAD='۰۱۲۳۴۵۶۷۸۹',ARD='٠١٢٣٤٥٦٧٨٩';
var fa=function(s){return String(s).replace(/\d/g,function(d){return FAD[+d]})};
var en=function(s){return String(s).replace(/[۰-۹]/g,function(d){return FAD.indexOf(d)}).replace(/[٠-٩]/g,function(d){return ARD.indexOf(d)})};
var num=function(s){var v=parseInt(en(s).replace(/[^\d]/g,''),10);return isNaN(v)?0:v};
var base=function(n){return fa(Math.round(n).toLocaleString('en-US')).replace(/,/g,'٬')};
var money=function(n){return n<0?'<span dir="ltr">−'+base(-n)+'</span>':base(n)};
var mt=function(n){return money(n)+' <small>تومان</small>'};
function words(n){
  var t=function(x){return fa(+x.toFixed(2))};
  if(n>=1e9)return t(n/1e9)+' میلیارد';
  if(n>=1e6)return t(n/1e6)+' میلیون';
  if(n>=1e3)return t(n/1e3)+' هزار';
  return '';
}
var pad=function(n){return String(n).padStart(2,'0')};
var key=function(y,m,d){return y+'-'+pad(m)+'-'+pad(d)};
var parts=function(s){return s.split('-').map(Number)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var uniq=function(a){return a.filter(function(x,i){return x&&a.indexOf(x)===i})};
function today(){var n=new Date(),j=toJ(n.getFullYear(),n.getMonth()+1,n.getDate());return{y:j.jy,m:j.jm,d:j.jd}}
function monthLabel(k){var p=parts(k);return MONTHS[p[1]-1]+' '+fa(p[0])}
function dayLabel(s){var p=parts(s);return p[2]?fa(p[2])+' '+MONTHS[p[1]-1]:'ماهانه'}

var COL={work:'works',exp:'expenses',rec:'receipts',claim:'claims',adv:'advances'};
var SAMPLE_CO=['شرکت آرمان بار','کارخانه سیمان نمونه','گروه صنعتی نمونه'];
var COLORS=['c1','c2','c3','c4','c5','c6'];
var DEFCATS=['لاستیک','تعمیرات','سوخت','عوارض و پارکینگ','حقوق راننده','بیمه و مالیات','سایر'];

var sheet=null;
function save(){persist()}

var sum=function(a){return a.reduce(function(s,r){return s+(+r.amount||0)},0)};
var cc=function(c){return/^c[1-6]$/.test(c)?c:'c6'};
var V=function(id){return S.vehicles.filter(function(v){return v.id===id})[0]||{name:'؟',color:'c6'}};
var chip=function(id){var v=V(id);return'<span class="chip" style="--c:var(--'+cc(v.color)+')">'+esc(v.name)+'</span>'};
var tagx=function(r){return r.src==='claim'?'<span class="tag">طلب ثبت‌شده</span>':r.src==='adj'?'<span class="tag">تعدیل</span>':''};
var inV=function(r){return ui.vf==='all'||r.vid===ui.vf};
function inPer(d,per){
  if(per==='all')return true;
  if(per.indexOf('..')>0){
    var ab=per.split('..'),a=ab[0],b=ab[1];
    if(d.slice(-2)==='00')return d.slice(0,7)>=a.slice(0,7)&&d.slice(0,7)<=b.slice(0,7);
    return d>=a&&d<=b;
  }
  return d.slice(0,7)===per;
}
var isMonth=function(per){return per.length===7};
function perLabel(per){
  if(per==='all')return'همه زمان‌ها';
  if(isMonth(per))return monthLabel(per);
  var ab=per.split('..'),f=function(x){var p=parts(x);return fa(p[0])+'/'+fa(pad(p[1]))+'/'+fa(pad(p[2]))};
  return'از '+f(ab[0])+' تا '+f(ab[1]);
}
function presetRange(k){
  var t=today(),y=t.y,m=t.m;
  if(k==='py')return key(t.y,1,1)+'..'+key(t.y,12,dim(t.y,12));
  var n=k==='p6'?5:2;m-=n;while(m<1){m+=12;y--}
  return key(y,m,1)+'..'+key(t.y,t.m,dim(t.y,t.m));
}
var inP=function(r){return inPer(r.date,ui.per)};
var scope=function(a){return a.filter(function(r){return inV(r)&&inP(r)})};
var byDate=function(a,b){return b.date<a.date?-1:b.date>a.date?1:0};
function months(){
  var t=today(),s={};s[key(t.y,t.m,1).slice(0,7)]=1;
  S.works.concat(S.expenses,S.receipts).forEach(function(r){s[r.date.slice(0,7)]=1});
  return Object.keys(s).sort().reverse();
}
function hasRecords(id){return S.works.concat(S.expenses,S.receipts,S.advances,S.claims).some(function(r){return r.vid===id})}

/* ---------- report ---------- */
function tbl(first,rows){
  var th=['کارکرد','هزینه','سود'];
  return'<div class="tw"><table><thead><tr><th>'+first+' <small>(تومان)</small></th>'+th.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){
      var p=r.w-r.e,d=r.w-r.r;
      var o={vid:r.vid,per:r.per};
      return'<tr'+(r.total?' class="tt"':'')+'><th scope="row">'+r.label+'</th><td>'+nb(money(r.w),'w',o)+'</td><td>'+nb(money(r.e),'e',o)+'</td><td class="'+(p<0?'bad':'')+'">'+nb(money(p),'p',o)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function pReport(){
  var W=scope(S.works),E=scope(S.expenses),R=scope(S.receipts);
  var w=sum(W),e=sum(E),r=sum(R),profit=w-e,due=w-r,cash=r-e;
  var h='<section class="card" aria-label="خلاصه">'+
    '<div class="ln"><span>کارکرد</span><b>'+nb(mt(w),'w')+'</b></div>'+
    '<div class="ln"><span>منهای هزینه‌ها</span><b>'+nb(mt(e),'e')+'</b></div>'+
    '<div class="ln tot"><span>سود</span><b class="'+(profit<0?'bad':'good')+'">'+nb(mt(profit),'p')+'</b></div></section>';
  h+=dongCard()+driverCard();

  if(ui.vf==='all'){
    var rows=S.vehicles.map(function(v){
      var f=function(a){return sum(a.filter(function(x){return x.vid===v.id&&inP(x)}))};
      return{label:'<span class="dot" style="--c:var(--'+cc(v.color)+')"></span>'+esc(v.name),vid:v.id,per:ui.per,w:f(S.works),e:f(S.expenses),r:f(S.receipts)};
    });
    rows.push({label:'جمع',vid:'',per:ui.per,w:w,e:e,r:r,total:true});
    h+='<section class="card"><h2>به تفکیک تریلی</h2>'+tbl('تریلی',rows)+'</section>';
  }
  if(!isMonth(ui.per)){
    var all=W.concat(E,R);
    var ms=months().filter(function(k){return all.some(function(x){return x.date.slice(0,7)===k})});
    if(ms.length){
      var mr=ms.map(function(k){
        var f=function(a){return sum(a.filter(function(x){return x.date.slice(0,7)===k}))};
        return{label:monthLabel(k),vid:ui.vf==='all'?'':ui.vf,per:k,w:f(W),e:f(E),r:f(R)};
      });
      h+='<section class="card"><h2>به تفکیک ماه</h2>'+tbl('ماه',mr)+'</section>';
    }
  }
  var e1=sum(E.filter(function(x){return x.cat===DRV_CAT})),e2=e-e1;
  var advS=sum(S.advances.filter(function(x){return inV(x)&&inP(x)}));
  var pc=function(x){return w>0?Math.max(0,Math.min(100,Math.abs(x)/w*100)):0};
  var cmp=function(lb,val,cls,note){return'<div class="bar"><span>'+lb+'</span><span class="v">'+money(val)+(w>0?' <small>'+fa(Math.round(val/w*100))+'٪ از درآمد</small>':'')+'</span><span class="tr"><i style="width:'+pc(val)+'%"></i></span>'+(note?'<small class="muted">'+note+'</small>':'')+'</div>'};
  h+='<section class="card"><h2>مقایسه درآمد و هزینه</h2>'+
    cmp('درآمد (کارکرد)',w)+
    cmp('حقوق راننده',e1,'','مساعده‌های داده‌شده: '+money(advS)+' (بخشی از همین حقوق)')+
    cmp('سایر هزینه‌ها',e2)+
    cmp('سود',profit)+'</section>';
  var cats={};E.forEach(function(x){if(x.cat!==DRV_CAT)cats[x.cat]=(cats[x.cat]||0)+x.amount});
  var ce=Object.keys(cats).map(function(k){return[k,cats[k]]}).sort(function(a,b){return b[1]-a[1]});
  if(ce.length){
    var mx=ce[0][1];
    h+='<section class="card"><h2>سایر هزینه‌ها به تفکیک دسته</h2>'+ce.map(function(c){
      return'<div class="bar"><span>'+esc(c[0])+'</span><span class="v">'+nb(money(c[1]),'e',{ct:c[0]})+' <small>'+fa(Math.round(c[1]/e2*100))+'٪</small></span><span class="tr"><i style="width:'+(c[1]/mx*100)+'%"></i></span></div>';
    }).join('')+'</section>';
  }
  var cr=claimRows();
  if(cr.length){
    h+='<section class="card"><h2>طلب از شرکت‌ها</h2><p class="muted" style="margin:0 0 6px">مستقل از ماه؛ کل طلب‌های باقی‌مانده</p>'+cr.map(companyRow).join('')+'</section>';
  }
  return h;
}

/* ---------- lists ---------- */
function summary(title,total,extra,m,o){
  return'<div class="card sum"><span>'+title+'</span><b>'+(m?nb(mt(total),m,o):mt(total))+'</b>'+(extra||'')+'</div>';
}
function grouped(items,fmt,msg,m,o){
  if(!items.length)return'<p class="empty">'+msg+'<br>با دکمه «+» پایین صفحه اولین مورد را ثبت کن.</p>';
  var g={};items.forEach(function(r){var k=r.date.slice(0,7);(g[k]=g[k]||[]).push(r)});
  return Object.keys(g).sort().reverse().map(function(k){
    return'<section class="grp"><h3><span>'+monthLabel(k)+'</span><span>'+(m?nb(money(sum(g[k])),m,Object.assign({per:k},o||{})):money(sum(g[k])))+'</span></h3>'+g[k].map(fmt).join('')+'</section>';
  }).join('');
}
function workItem(r){
  return'<button class="item" data-act="edit" data-t="work" data-id="'+r.id+'"><div class="l1"><b>'+esc(r.company||'بدون نام')+'</b><span class="amt">'+money(r.amount)+'</span></div><div class="l2">'+chip(r.vid)+tagx(r)+'<span>'+dayLabel(r.date)+'</span>'+(r.desc?'<span>'+esc(r.desc)+'</span>':'')+'</div></button>';
}
function expItem(r){
  return'<button class="item" data-act="edit" data-t="exp" data-id="'+r.id+'"><div class="l1"><b>'+esc(r.desc||r.cat)+'</b><span class="amt">'+money(r.amount)+'</span></div><div class="l2">'+chip(r.vid)+tagx(r)+'<span class="tag">'+esc(r.cat)+'</span><span>'+dayLabel(r.date)+'</span>'+(r.payer?'<span>پرداخت: '+esc(r.payer)+'</span>':'')+'</div></button>';

function recItem(r){
  return'<button class="item" data-act="edit" data-t="rec" data-id="'+r.id+'"><div class="l1"><b>'+esc(r.company||'بدون نام')+'</b><span class="amt">'+money(r.amount)+'</span></div><div class="l2">'+chip(r.vid)+tagx(r)+'<span>'+dayLabel(r.date)+'</span>'+(r.desc?'<span>'+esc(r.desc)+'</span>':'')+'</div></button>';

function pWork(){
  var items=scope(S.works).sort(byDate);
  return summary('جمع کارکرد',sum(items),'','w')+grouped(items,workItem,'کارکردی در این بازه ثبت نشده.','w');

function pRec(){
  var items=scope(S.receipts).sort(byDate);

function pExp(){
  var base0=scope(S.expenses),cats=uniq(base0.map(function(x){return x.cat}));
  if(ui.cat!=='all'&&cats.indexOf(ui.cat)<0)ui.cat='all';
  var items=base0.filter(function(x){return ui.cat==='all'||x.cat===ui.cat}).sort(byDate);
  var pay={};items.forEach(function(x){var p=x.payer||'نامشخص';pay[p]=(pay[p]||0)+x.amount});
  var pk=Object.keys(pay);
  var payH=pk.length?'<div class="pay">'+pk.map(function(p){return'<span>'+esc(p)+': <b>'+money(pay[p])+'</b></span>'}).join('')+'</div>':'';
  var chips='<div class="seg cats" role="group" aria-label="دسته هزینه">'+['all'].concat(cats).map(function(c){
    return'<button data-act="cat" data-c="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+(c==='all'?'همه دسته‌ها':esc(c))+'</button>';
  }).join('')+'</div>';
  return chips+summary(ui.cat==='all'?'جمع هزینه‌ها':'جمع '+esc(ui.cat),sum(items),payH,'e',ui.cat==='all'?{}:{ct:ui.cat})+grouped(items,expItem,'هزینه‌ای در این بازه ثبت نشده.','e',ui.cat==='all'?{}:{ct:ui.cat});
}

function fld(lb,inner,id,extra){return'<div class="f"><label class="lb"'+(id?' for="'+id+'"':'')+'>'+lb+'</label>'+inner+(extra||'')+'</div>'}
function dateInput(id,val,monthOnly){
  var p=parts(val);
  return'<div class="dt'+(monthOnly?' m':'')+'" id="'+id+'">'+(monthOnly?'':'<input inputmode="numeric" data-p="d" value="'+fa(p[2]||1)+'" aria-label="روز">')+

    '<input inputmode="numeric" data-p="y" value="'+fa(p[0])+'" aria-label="سال"></div>';

function dfld(lb,id,val,monthOnly){return'<div class="f"><span class="lb">'+lb+'</span>'+dateInput(id,val,monthOnly)+'</div>'}
function readDate(id,monthOnly){
  var el=document.getElementById(id);
  var y=num($('[data-p=y]',el).value),m=+$('[data-p=m]',el).value,d=monthOnly?0:num($('[data-p=d]',el).value);

function openRange(){
  var t=today(),a=isMonth(ui.per)?key(parts(ui.per)[0],parts(ui.per)[1],1):(ui.per.indexOf('..')>0?ui.per.split('..')[0]:key(t.y,t.m,1));

  sheet={type:'range',id:null};
  $('#sheetRoot').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><h2>بازه دلخواه</h2>'+
    dfld('از تاریخ','rf',a,false)+dfld('تا تاریخ','rt',b,false)+
    '<p class="muted">ثبت‌های «ماهانه (یکجا)» اگر ماهشان داخل بازه باشد حساب می‌شوند.</p><p class="err" id="err" role="alert"></p>'+
    '<div class="acts"><button class="btn primary" data-act="saverange">نمایش</button><button class="btn ghost" data-act="close">انصراف</button></div></div></div>';
}
function saveSheet(){
  if(!sheet)return;
  var t=sheet.type,err=function(m){$('#err').textContent=m};
  var ed0=sheet.id?S[COL[t]].filter(function(x){return x.id===sheet.id})[0]:null;
  var amount=(ed0&&ed0.src==='adj')?snum($('#amt').value):num($('#amt').value);
  if(!amount)return err('مبلغ را وارد کن.');
  var rec={vid:$('#vid').value,amount:amount,desc:$('#desc').value.trim()},date;
  if(t==='work'){
    date=sheet.kind==='monthly'?readDate('wm',true):readDate('wd',false);
    if(!date)return err('تاریخ درست نیست.');
    rec.company=$('#company').value.trim();
    if(!rec.company)return err('نام شرکت یا مشتری را بنویس.');
  }else if(t==='exp'){
    date=readDate('ed',false);
    if(!date)return err('تاریخ درست نیست.');
    rec.cat=$('#cat').value.trim();rec.payer=$('#payer').value.trim();
    if(!rec.cat)return err('دسته هزینه را انتخاب کن یا بنویس.');
  }else if(t==='adv'){
    date=readDate('ad',false);
    if(!date)return err('تاریخ درست نیست.');
  }else if(t==='claim'){
    date=readDate('cd',false);
    if(!date)return err('تاریخ درست نیست.');
    rec.company=$('#company').value.trim();
    if(!rec.company)return err('بنویس طلب از کجا است.');
    if(!rec.desc)rec.desc='طلب ثبت‌شده';
  }else{
    date=readDate('rd',false);
    if(!date)return err('تاریخ درست نیست.');
    rec.company=$('#company').value.trim();
    if(!rec.company)return err('بنویس از کجا دریافت شده.');
  }
  rec.date=date;
  var list=S[COL[t]];
  if(sheet.id){var o=list.filter(function(x){return x.id===sheet.id})[0];Object.assign(o,rec)}
  else{rec.id=uid();list.push(rec)}
  var moved=false;
  if(!inPer(rec.date,ui.per)){ui.per=rec.date.slice(0,7);ui.pk='';moved=true}
  save();closeSheet();render();toast(moved?'ذخیره شد؛ نمایش به '+monthLabel(ui.per)+' رفت':'ذخیره شد');
}

/* ---------- editable numbers (adjustments) + claims ---------- */
var MN={cl:'طلب',w:'کارکرد',e:'هزینه‌ها',r:'دریافتی',p:'سود',c:'سود دریافت‌شده',d:'سود دریافت‌نشده (طلب)'};
var ADJ_CO='تعدیل (بدون شرکت)',ADJ_CAT='تعدیل';
var snum=function(s){var t=en(s),neg=/^\s*[-−–]/.test(t),n=num(t);return neg?-n:n};
function nb(html,m,o){
  o=o||{};
  var vid=o.vid!==undefined?o.vid:(ui.vf==='all'?'':ui.vf);
  var per=o.per!==undefined?o.per:ui.per;
  return'<button class="num" data-act="adj" data-m="'+m+'" data-vid="'+esc(vid)+'" data-per="'+per+'"'+(o.co!==undefined?' data-co="'+esc(o.co)+'"':'')+(o.ct!==undefined?' data-ct="'+esc(o.ct)+'"':'')+' title="ویرایش عدد">'+html+'</button>';
}
function calcCtx(c){
  var f=function(a,co,ct){return a.filter(function(x){
    return(!c.vid||x.vid===c.vid)&&inPer(x.date,c.per)&&(!co||c.co===undefined||x.company===c.co)&&(!ct||c.ct===undefined||x.cat===c.ct);
  })};
  var w=sum(f(S.works,1,0)),e=sum(f(S.expenses,0,1)),r=sum(f(S.receipts,1,0));
  return{w:w,e:e,r:r,p:w-e,c:r-e,d:w-r,cl:sum(f(S.claims,1,0))-r};
}
function adjDate(c){
  var t=today();
  if(c.per!=='all'){var p=parts(c.per.indexOf('..')>0?c.per.split('..')[1]:c.per);return key(p[0],p[1],0)}
  return key(t.y,t.m,t.d);
}
function openAdjust(c){
  var cur=calcCtx(c)[c.m];
  var ch={p:[['w','کارکرد'],['e','هزینه']],c:[['r','دریافتی'],['e','هزینه']],d:[['w','کارکرد'],['r','دریافتی']],cl:[['cl','طلب'],['r','دریافتی']]}[c.m];
  sheet={type:'adj',id:null,ctx:c,cur:cur,target:ch?ch[0][0]:c.m};
  var tx=[c.vid?V(c.vid).name:'همه تریلی‌ها',perLabel(c.per)];
  if(c.co!==undefined)tx.push(c.co||'بدون نام');
  if(c.ct!==undefined)tx.push(c.ct);
  var body='<h2>ویرایش عدد: '+MN[c.m]+'</h2><p class="muted">'+tx.map(function(x){return esc(x)}).join(' · ')+'</p>'+
    '<div class="ln"><span>عدد محاسبه‌شده از ثبت‌ها</span><b>'+mt(cur)+'</b></div>'+
    fld('عدد واقعی (تومان)','<input id="real" inputmode="'+(c.m==='p'||c.m==='c'?'text':'numeric')+'" autocomplete="off" value="'+(cur<0?'-':'')+fa(Math.abs(cur))+'">','real','<div class="hint" id="adjh"></div>')+
    (ch?'<div class="f"><span class="lb">اختلاف را روی کدام ثبت کنم؟</span><div class="seg2" role="group">'+ch.map(function(x,i){return'<button type="button" data-act="tgt" data-k="'+x[0]+'" aria-pressed="'+(i===0)+'">'+x[1]+'</button>'}).join('')+'</div></div>':'')+
    (c.vid?'':fld('اختلاف روی کدام تریلی ثبت شود؟',vsel('vid',null),'vid'))+
    '<p class="muted">اختلاف به صورت یک ثبت «تعدیل» اضافه می‌شود و در لیست‌ها قابل ویرایش و حذف است.</p>'+
    tail(null);
  $('#sheetRoot').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+body+'</div></div>';
  adjHint();
}
function adjHint(){
  var i=$('#real'),h=$('#adjh');
  if(!i||!h||!sheet||sheet.type!=='adj')return;
  var d=snum(i.value)-sheet.cur;
  h.innerHTML=d?'اختلاف: '+mt(d):'بدون تغییر';
}
function saveAdjust(){
  if(!sheet||sheet.type!=='adj')return;
  var c=sheet.ctx,err=function(m){$('#err').textContent=m};
  var raw=$('#real').value;
  if(!/\d/.test(en(raw)))return err('عدد واقعی را بنویس.');
  var diff=snum(raw)-sheet.cur;
  if(!diff){closeSheet();toast('تغییری نبود');return}
  var tg=sheet.target,coll,amt=diff;
  if(c.m==='p'){if(tg==='w')coll='works';else{coll='expenses';amt=-diff}}
  else if(c.m==='c'){if(tg==='r')coll='receipts';else{coll='expenses';amt=-diff}}
  else if(c.m==='cl'){if(tg==='cl')coll='claims';else{coll='receipts';amt=-diff}}
  else if(c.m==='d'){if(tg==='w')coll='works';else{coll='receipts';amt=-diff}}
  else coll={w:'works',e:'expenses',r:'receipts'}[c.m];
  var rec={id:uid(),src:'adj',vid:c.vid||$('#vid').value,date:adjDate(c),amount:amt,desc:'تعدیل به عدد واقعی'};
  if(coll==='expenses'){rec.cat=c.ct!==undefined?c.ct:ADJ_CAT;rec.payer=''}
  else rec.company=c.co!==undefined?c.co:ADJ_CO;
  S[coll].push(rec);
  save();closeSheet();render();toast('تعدیل ثبت شد');
}
function fClaim(r){
  return'<h2>'+(r?'ویرایش طلب':'ثبت طلب')+'</h2><p class="muted">طلب را از هر شرکتی که داری بنویس. این مبلغ جزو کارکرد و سود ماه نیست. هر دریافتی از همان شرکت از آن کم می‌شود.</p>'+
    fld('تریلی',vsel('vid',r&&r.vid),'vid')+

    fld('توضیح','<input id="desc" autocomplete="off" value="'+esc(r?r.desc:'')+'" placeholder="مثلاً مانده حساب قبلی">','desc')+

function claimRows(){
  var C=S.claims.filter(inV),R=S.receipts.filter(inV),co={};
  C.forEach(function(x){var o=co[x.company]||(co[x.company]={w:0,r:0});o.w+=x.amount});
  R.forEach(function(x){var o=co[x.company]||(co[x.company]={w:0,r:0});o.r+=x.amount});
  return Object.keys(co).map(function(n){return{n:n,w:co[n].w,r:co[n].r,d:co[n].w-co[n].r}}).filter(function(c){return c.w||c.d}).sort(function(a,b){return b.d-a.d});
}
function companyRow(c){
  var o={co:c.n,per:'all'};
  return'<div class="co"><div><b>'+esc(c.n||'بدون نام')+'</b><small>طلب ثبت‌شده '+money(c.w)+' · دریافتی '+money(c.r)+'</small></div><span class="amt '+(c.d>0?'duec':'')+'">'+nb(money(c.d),'cl',o)+'</span></div>';

function claimItem(r){

function pClaim(){
  var cr=claimRows(),C=S.claims.filter(inV),d=sum(C)-sum(S.receipts.filter(inV));
  return'<div class="card sum"><span>جمع طلب‌ها</span><b class="duec">'+nb(mt(d),'cl',{per:'all'})+'</b></div>'+

    (C.length?'<section class="card"><h2>طلب‌های ثبت‌شده</h2>'+C.slice().sort(byDate).map(claimItem).join('')+'</section>':'');

/* ---------- partners: dong shares ---------- */
function payBlock(v){
  var p=v.pay||{pct:0,fix:0};
  return'<div class="dg"><span class="lb">حقوق راننده</span>'+
    '<label><span>درصد از کارکرد</span><input inputmode="decimal" autocomplete="off" data-v="'+v.id+'" data-pay="pct" value="'+fa(p.pct||0)+'" aria-label="درصد حقوق راننده"></label>'+
    '<label><span>مبلغ ثابت ماهانه (تومان)</span><input inputmode="numeric" autocomplete="off" data-v="'+v.id+'" data-pay="fix" value="'+fa(p.fix||0)+'" aria-label="مبلغ ثابت ماهانه"></label></div>';
}
function monthsSpan(per){
  var ab=per.split('..'),a=parts(ab[0]),b=parts(ab[1]);
  return Math.max(1,(b[0]-a[0])*12+(b[1]-a[1])+1);
}
function driverCalc(v){
  var p=v.pay||{pct:0,fix:0};
  var ws=S.works.filter(function(x){return x.vid===v.id&&inP(x)}),w=sum(ws),ms={};
  ws.forEach(function(x){ms[x.date.slice(0,7)]=1});
  var nm=isMonth(ui.per)?1:ui.per.indexOf('..')>0?monthsSpan(ui.per):Object.keys(ms).length;
  var sal=Math.round(w*(+p.pct||0)/100+(+p.fix||0)*nm);
  var ex=S.expenses.filter(function(x){return x.vid===v.id&&inP(x)});
  var rec=sum(ex.filter(function(x){return x.cat===DRV_CAT}));
  var re=sum(ex.filter(function(x){return x.payer==='راننده'&&x.cat!==DRV_CAT}));
  var ad=S.advances.filter(function(x){return x.vid===v.id&&inP(x)}).sort(byDate);
  var adv=sum(ad);
  return{w:w,sal:sal,rec:rec,re:re,ad:ad,adv:adv,due:sal+re-adv,gap:sal-rec};
}
function driverCard(){
  var vs=(ui.vf==='all'?S.vehicles:S.vehicles.filter(function(v){return v.id===ui.vf})).filter(function(v){var p=v.pay||{};return(+p.pct||0)||(+p.fix||0)});
  if(!vs.length)return'';
  return'<section class="card"><h2>حساب راننده</h2>'+vs.map(function(v){
    var c=driverCalc(v),p=v.pay;
    var note=!isMonth(ui.per)?'<p class="muted" style="margin:6px 0 0">برای ثبت حقوق در هزینه‌ها، بالای صفحه یک ماه را انتخاب کن.</p>':
      c.gap>0?'<button class="btn" style="margin-top:8px" data-act="paysal" data-v="'+v.id+'">ثبت حقوق در هزینه‌ها ('+money(c.gap)+' تومان)</button>':
      '<p class="muted" style="margin:6px 0 0">'+(c.gap<0?'حقوق ثبت‌شده در هزینه‌ها از مبلغ محاسبه‌شده بیشتر است.':'حقوق در هزینه‌ها ثبت شده است.')+'</p>';
    return'<div style="--c:var(--'+cc(v.color)+');margin-top:10px">'+chip(v.id)+' <span class="muted">'+fa(p.pct||0)+'٪ کارکرد'+((+p.fix)?' + '+money(+p.fix)+' ثابت':'')+'</span>'+
      '<div class="ln"><span>کارکرد</span><b>'+money(c.w)+'</b></div>'+
      '<div class="ln"><span>حقوق محاسبه‌شده</span><b>'+money(c.sal)+'</b></div>'+
      '<div class="ln"><span>هزینه‌های پرداخت‌شده توسط راننده</span><b>+ '+money(c.re)+'</b></div>'+
      '<div class="ln"><span>مساعده‌های داده‌شده (بخشی از حقوق)</span><b>− '+money(c.adv)+'</b></div>'+
      '<div class="ln tot"><span>قابل پرداخت به راننده</span><b style="font-size:20px" class="'+(c.due<0?'bad':'')+'">'+mt(c.due)+'</b></div>'+
      (c.due<0?'<p class="muted" style="margin:0;color:var(--bad)">منفی یعنی راننده از مساعده بیشتر خرج نکرده و به شما بدهکار است.</p>':'')+
      c.ad.map(function(r){return'<button class="item" data-act="edit" data-t="adv" data-id="'+r.id+'"><div class="l1"><b>مساعده</b><span class="amt">'+money(r.amount)+'</span></div><div class="l2"><span>'+dayLabel(r.date)+'</span>'+(r.desc?'<span>'+esc(r.desc)+'</span>':'')+'</div></button>'}).join('')+
      '<button class="btn ghost" style="margin-top:8px" data-act="add" data-t="adv" data-v="'+v.id+'">+ مساعده</button>'+note+'</div>';
  }).join('')+
  '<p class="muted" style="margin:12px 0 0">هزینه‌هایی که راننده خرج می‌کند فقط یک بار در هزینه‌ها حساب می‌شود. مساعده بخشی از پرداخت حقوق است و هزینه جدا حساب نمی‌شود؛ فقط از مبلغ قابل پرداخت کم می‌شود. سود فقط حقوقی را کم می‌کند که با دکمه بالا یا دستی در هزینه‌ها ثبت کنی.</p></section>';
}
function dongBlock(v){
  return'<div class="dg"><span class="lb">سهم دانگ‌ها (جمع باید ۶ باشد)</span>'+S.partners.map(function(n,i){
    var d=(v.dongs||[])[i];
    return'<label><span>'+esc(n)+'</span><input inputmode="decimal" autocomplete="off" data-v="'+v.id+'" data-dong="'+i+'" value="'+fa(d===undefined?0:d)+'" aria-label="دانگ '+esc(n)+'"></label>';
  }).join('')+'</div>';
}
function dongCard(){
  var vs=ui.vf==='all'?S.vehicles:S.vehicles.filter(function(v){return v.id===ui.vf});
  if(!vs.length||!S.partners)return'';
  var res=S.partners.map(function(){return{d:0,p:0,c:0,u:0}}),per=[],warn=false;
  vs.forEach(function(v){
    var f=function(a){return sum(a.filter(function(x){return x.vid===v.id&&inP(x)}))};
    var w=f(S.works),e=f(S.expenses),r=f(S.receipts),p=w-e,c=r-e,u=w-r,tot=0;
    per.push('<span>'+esc(v.name)+': <b>'+money(p/6)+'</b></span>');
    S.partners.forEach(function(n,i){
      var d=+(v.dongs||[])[i]||0,k=d/6;tot+=d;
      res[i].d+=d;res[i].p+=p*k;res[i].c+=c*k;res[i].u+=u*k;
    });
    if(Math.abs(tot-6)>1e-9)warn=true;
  });
  var th=['دانگ','سهم سود'];
  return'<section class="card"><h2>سهم شرکا</h2><p class="muted">سود هر دانگ از ۶ دانگ: '+per.join(' · ')+'</p>'+
    '<div class="tw"><table><thead><tr><th>شریک <small>(تومان)</small></th>'+th.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+
    S.partners.map(function(n,i){var x=res[i];return'<tr><th scope="row">'+esc(n)+'</th><td>'+fa(+x.d.toFixed(2))+'</td><td>'+money(x.p)+'</td></tr>'}).join('')+
    '</tbody></table></div>'+
    (warn?'<p class="muted" style="margin:8px 0 0;color:var(--bad)">جمع دانگ‌های یکی از تریلی‌ها ۶ نیست. در بخش «خودروها» اصلاح کن.</p>':'')+'</section>';
}

/* ---------- helpers: toast, copy, arm ---------- */
var tt;
function toast(m){var el=$('#toast');el.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(tt);tt=setTimeout(function(){el.innerHTML=''},2300)}
function armed(b,msg){
  if(b.dataset.armed)return true;
  b.dataset.armed='1';b.dataset.orig=b.textContent;b.textContent=msg;b.classList.add('armed');
  setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.orig;b.classList.remove('armed')}},4000);
  return false;
}
function copyText(txt,done){
  var fb=function(){var ta=$('#fallback');if(!ta)return;ta.hidden=false;ta.value=txt;ta.focus();ta.select();toast('متن آماده است؛ انتخاب و کپی کن')};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(done)},fb);return}
  }catch(e){}
  fb();
}
function tsv(){
  var rows=[['نوع','تاریخ','تریلی','شرکت/دسته','شرح','مبلغ','پرداخت‌کننده']];
  var d=function(s){var p=parts(s);return p[0]+'/'+pad(p[1])+(p[2]?'/'+pad(p[2]):'')};
  S.works.forEach(function(r){rows.push(['کارکرد',d(r.date),V(r.vid).name,r.company,r.desc,r.amount,''])});
  S.expenses.forEach(function(r){rows.push(['هزینه',d(r.date),V(r.vid).name,r.cat,r.desc,r.amount,r.payer])});
  S.receipts.forEach(function(r){rows.push(['دریافتی',d(r.date),V(r.vid).name,r.company,r.desc,r.amount,''])});
  S.claims.forEach(function(r){rows.push(['طلب',d(r.date),V(r.vid).name,r.company,r.desc,r.amount,''])});
  S.advances.forEach(function(r){rows.push(['مساعده',d(r.date),V(r.vid).name,'',r.desc,r.amount,''])});
  return rows.map(function(r){return r.map(function(c){return String(c==null?'':c).replace(/[\t\n]/g,' ')}).join('\t')}).join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v;
  switch(a){
    case 'tab':ui.tab=b.dataset.t;ui.cat='all';window.scrollTo(0,0);render();break;
    case 'vf':ui.vf=b.dataset.v;render();break;
    case 'cat':ui.cat=b.dataset.c;render();break;
    case 'add':openSheet(b.dataset.t,null,b.dataset.v);break;
    case 'edit':openSheet(b.dataset.t,b.dataset.id);break;
    case 'scrim':if(e.target===b)closeSheet();break;
    case 'close':closeSheet();break;
    case 'save':if(sheet&&sheet.type==='adj')saveAdjust();else saveSheet();break;
    case 'del':
      if(!armed(b,'دوباره بزن تا حذف شود'))return;
      S[COL[sheet.type]]=S[COL[sheet.type]].filter(function(x){return x.id!==sheet.id});
      save();closeSheet();render();toast('حذف شد');break;
    case 'kind':{
      sheet.kind=b.dataset.k;var mo=sheet.kind==='monthly';
      $('#dwrap').hidden=mo;$('#mwrap').hidden=!mo;
      $$('.seg2 button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.k===sheet.kind))});
      break;}
    case 'pick':{
      document.getElementById(b.dataset.t).value=b.dataset.val;
      $$('[data-for="'+b.dataset.t+'"] button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
      break;}
    case 'adj':{
      var ac={m:b.dataset.m,vid:b.dataset.vid,per:b.dataset.per};
      if(b.hasAttribute('data-co'))ac.co=b.dataset.co;
      if(b.hasAttribute('data-ct'))ac.ct=b.dataset.ct;
      openAdjust(ac);break;}
    case 'tgt':sheet.target=b.dataset.k;$$('.seg2 [data-act=tgt]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});break;
    case 'color':v=S.vehicles.filter(function(x){return x.id===b.dataset.v})[0];v.color=b.dataset.c;save();render();break;
    case 'addf':v=S.vehicles.filter(function(x){return x.id===b.dataset.v})[0];v.fields.push({k:'',v:''});save();render();break;
    case 'rmf':v=S.vehicles.filter(function(x){return x.id===b.dataset.v})[0];v.fields.splice(+b.dataset.i,1);save();render();break;
    case 'addv':
      S.vehicles.push({id:uid(),name:'خودروی '+fa(S.vehicles.length+1),color:COLORS[S.vehicles.length%COLORS.length],dongs:[3,3],pay:{pct:0,fix:0},fields:['پلاک','رنگ','شماره پروانه'].map(function(k){return{k:k,v:''}})});
      save();render();break;
    case 'delv':
      if(!armed(b,'دوباره بزن تا حذف شود'))return;
      S.vehicles=S.vehicles.filter(function(x){return x.id!==b.dataset.v});save();render();break;
    case 'saverange':{
      var ra=readDate('rf',false),rb=readDate('rt',false);
      if(!ra||!rb){$('#err').textContent='تاریخ درست نیست.';return}
      if(ra>rb){$('#err').textContent='تاریخ شروع باید قبل از پایان باشد.';return}
      ui.per=ra+'..'+rb;ui.pk='custom';closeSheet();render();break;}
    case 'paysal':{
      v=S.vehicles.filter(function(x){return x.id===b.dataset.v})[0];
      if(!v||!isMonth(ui.per))return;
      var dc=driverCalc(v);if(dc.gap<=0)return;
      S.expenses.push({id:uid(),vid:v.id,date:ui.per+'-00',cat:DRV_CAT,desc:'حقوق راننده',amount:dc.gap,payer:'خودم'});
      save();render();toast('حقوق در هزینه‌ها ثبت شد');break;}
    case 'clear':
      if(!armed(b,'دوباره بزن تا نمونه‌ها پاک شود'))return;
      S={sample:false,partners:S.partners,vehicles:S.vehicles.map(function(x){return{id:x.id,name:x.name,color:x.color,dongs:x.dongs,pay:x.pay,fields:x.fields.map(function(f){return{k:f.k,v:''}})}}),works:[],expenses:[],receipts:[],advances:[],claims:[]};
      save();render();toast('نمونه‌ها پاک شد');break;
    case 'copybk':copyText(JSON.stringify(S),'پشتیبان کپی شد');break;
    case 'copytsv':copyText(tsv(),'کپی شد؛ در اکسل یا Numbers بچسبان');break;
    case 'restore':{
      var t=$('#rest').value.trim();
      if(!t){toast('اول متن پشتیبان را بچسبان');return}
      var o;try{o=JSON.parse(t)}catch(x){toast('متن پشتیبان درست نیست');return}
      if(!o||!Array.isArray(o.vehicles)||!Array.isArray(o.works)||!Array.isArray(o.expenses)||!Array.isArray(o.receipts)||!o.vehicles.length){toast('این متن، پشتیبان این برنامه نیست');return}
      if(!armed(b,'دوباره بزن تا جایگزین شود'))return;
      S=norm(o);ui.vf='all';save();render();toast('بازیابی شد');break;}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.pay){
    var pv=S.vehicles.filter(function(x){return x.id===t.dataset.v})[0];
    if(pv){pv.pay=pv.pay||{pct:0,fix:0};pv.pay[t.dataset.pay]=t.dataset.pay==='pct'?(parseFloat(en(t.value).replace('٫','.'))||0):num(t.value);save()}
    return;
  }
  if(t.dataset&&t.dataset.dong!==undefined){
    var dv=S.vehicles.filter(function(x){return x.id===t.dataset.v})[0];
    if(dv){dv.dongs=dv.dongs||[3,3];dv.dongs[+t.dataset.dong]=parseFloat(en(t.value).replace('٫','.'))||0;save()}
    return;
  }
  if(t.id==='real'){adjHint();return}
  if(t.id==='amt'){amtHint();return}
  if(t.dataset&&t.dataset.v&&t.dataset.p){
    var v=S.vehicles.filter(function(x){return x.id===t.dataset.v})[0];if(!v)return;
    if(t.dataset.p==='name')v.name=t.value;else{var f=v.fields[+t.dataset.i];if(f)f[t.dataset.p]=t.value}
    save();
  }
  if(t.id==='cat'||t.id==='payer'||t.id==='company'){
    $$('[data-for="'+t.id+'"] button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.val===t.value))});
  }
});
document.addEventListener('change',function(e){
  if(e.target.id!=='per')return;
  var v=e.target.value;
  if(v==='custom'){openRange();return}
  ui.pk='';
  if(v==='p3'||v==='p6'||v==='py'){ui.pk=v;ui.per=presetRange(v)}else ui.per=v;
  render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet()});

$('#app').innerHTML='<div id="shell"></div><div id="sheetRoot"></div><div id="toast" aria-live="polite"></div>';
render();
})();
</script>
